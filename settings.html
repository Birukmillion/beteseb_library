<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Settings - Change Password</title>
    <link rel="stylesheet" href="../../assets/css/settings.css"> <!-- optional, for design -->
</head>
<body>
    <h2>Change Your Password</h2>
    <form id="passwordForm" method="POST" action="../php/update_password.php">
        <label for="current_password">Current Password:</label><br>
        <input type="password" id="current_password" name="current_password" required><br><br>

        <label for="new_password">New Password:</label><br>
        <input type="password" id="new_password" name="new_password" required><br><br>

        <label for="confirm_password">Confirm New Password:</label><br>
        <input type="password" id="confirm_password" name="confirm_password" required><br><br>

        <button type="submit">Update Password</button>
    </form>

    <script src="../../assets/js/settings.js"></script> <!-- optional, for form checking -->
</body>
</html>
